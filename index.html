
<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>

    <style>
        body {
            font-family: Arial;
            background: lightblue;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input, select, textarea {
            width: 95%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        .full {
            grid-column: 1 / 3;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Admission Form</h2>

    <form>

        <input type="text" placeholder="Student Name" required>

        <input type="email" placeholder="Email" required>

        <input type="tel" placeholder="Phone Number">

        <input type="date">

        <select>
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <select>
            <option>Select Course</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>IT</option>
        </select>

        <textarea class="full" placeholder="Address"></textarea>

        <button class="full" type="submit">
            Submit
        </button>

    </form>

</div>

</body>
</html>
